version: 1
rules:
  - id: require-pixi-manifest
    kind: file_exists
    paths: pixi.toml
    level: error
    message: pixi.toml is required.
  - id: require-tasknest-config
    kind: file_exists
    paths: tasknest.toml
    level: error
    message: tasknest.toml is required.
  - id: require-ci
    kind: file_exists
    paths: .github/workflows/ci.yml
    level: error
    message: CI workflow is required.
  - id: require-templates
    kind: dir_exists
    paths: templates
    level: error
    message: templates directory is required.
  - id: tools-python-only
    kind: dir_only_contains
    select: tools
    allow:
      - '*.py'
    level: error
    message: tools may only contain Python task and helper files (*.py).
  - id: tools-no-subdirectories
    kind: dir_absent
    paths: 'tools/*'
    level: error
    message: tools may not contain subdirectories.
  - id: tools-require-check
    kind: file_exists
    paths: tools/check.py
    level: error
    message: tools/check.py is required.
  - id: tools-require-test
    kind: file_exists
    paths: tools/test.py
    level: error
    message: tools/test.py is required.
  - id: require-sandbox-config
    kind: file_exists
    paths: pixi-sandbox.toml
    level: error
    message: pixi-sandbox.toml is required.
  - id: require-sandbox-restore
    kind: file_exists
    paths: scripts/restore.sh
    level: error
    message: The generated pixi-sandbox restore launcher is required.
  - id: require-sandbox-publisher
    kind: file_exists
    paths: .github/workflows/publish-sandbox.yml
    level: error
    message: The generated sandbox publishing workflow is required.
  - id: require-sandbox-relock
    kind: file_exists
    paths: .github/workflows/relock.yml
    level: error
    message: The generated relock workflow is required.
  - id: require-ts-tsconfig
    kind: file_exists
    paths: packages/tasknest/tsconfig.json
    level: error
    message: packages/tasknest/tsconfig.json is required.
  - id: tsconfig-pkg-root-alias
    kind: json_path_equals
    paths: 'packages/*/tsconfig.json'
    path: $.compilerOptions.paths['@/*']
    equals:
      - './*'
    level: error
    message: Package tsconfig.json must map @/* to the package root (./*).
  - id: ts-import-prefixes
    kind: import_gate
    language: js
    paths: 'packages/**/*.{ts,tsx,js,jsx,mts,cts}'
    forbid: '(^|/)\.\.(/|$)|^(/|~|#)|^@$'
    level: error
    message: Use @/, @<pkg-name>, or ./ imports instead of parent (../) or non-@ aliases.
