name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          pixi-version: v0.84.2
          cache: true
      - run: pixi run --locked bun-install
      - run: pixi run --locked tools run check
      - run: pixi run --locked tools run test
      - run: pixi run --locked tools run py_compat
      - run: pixi run --locked tools run ts_compat
      - run: pixi run --locked bun pm pack --cwd packages/tasknest --destination "${{ runner.temp }}/ts-dist"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tasknest-tarball
          path: ${{ runner.temp }}/ts-dist/*.tgz
          retention-days: 1
  python-versions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {python: '3.10', tox: py310}
          - {python: '3.11', tox: py311}
          - {python: '3.12', tox: py312}
          - {python: '3.13', tox: py313}
          - {python: '3.14', tox: py314}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'tox>=4,<5'
      - run: tox -e ${{ matrix.tox }}-core,${{ matrix.tox }}-skill
  bun-versions:
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bun: ['1.1', '1.4', 'latest']
    steps:
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ matrix.bun }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tasknest-tarball
          path: ${{ runner.temp }}/ts-dist
      - name: Verify package install and ESM import in Bun ${{ matrix.bun }}
        shell: bash
        run: |
          set -euo pipefail
          tgz=$(ls "${{ runner.temp }}/ts-dist"/archont561-tasknest-*.tgz)
          consumer="${{ runner.temp }}/consumer"
          mkdir -p "$consumer"
          printf '{"name":"consumer","type":"module"}\n' > "$consumer/package.json"
          printf 'import { version } from "@archont561/tasknest";\nif (!/^\\d+\\.\\d+\\.\\d+/.test(version)) throw new Error(version);\n' > "$consumer/check.ts"
          cd "$consumer"
          bun add "$tgz"
          bun run check.ts
          bun ./node_modules/.bin/tasknest --version
  node-versions:
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tasknest-tarball
          path: ${{ runner.temp }}/ts-dist
      - name: Verify package install and ESM import in Node.js ${{ matrix.node }}
        shell: bash
        run: |
          set -euo pipefail
          tgz=$(ls "${{ runner.temp }}/ts-dist"/archont561-tasknest-*.tgz)
          consumer="${{ runner.temp }}/consumer"
          mkdir -p "$consumer"
          printf '{"name":"consumer","type":"module"}\n' > "$consumer/package.json"
          printf 'import { createRequire } from "node:module";\nimport { version } from "@archont561/tasknest";\nconst pkg = createRequire(import.meta.url)("@archont561/tasknest/package.json");\nif (!/^\\d+\\.\\d+\\.\\d+/.test(version) || pkg.name !== "@archont561/tasknest") throw new Error(version);\n' > "$consumer/check.mjs"
          cd "$consumer"
          npm install --no-save "$tgz"
          node check.mjs
          ./node_modules/.bin/tasknest --version
