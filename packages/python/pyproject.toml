[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tasknest"
version = "0.1.0.dev0"
description = "Python task runner scaffold"
requires-python = ">=3.10"
license = "MIT"

[project.optional-dependencies]
skill = ["jinja2>=3.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/tasknest"]
