[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tasknest"
version = "0.1.0"
description = "Python task runner scaffold"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/Archont561/tasknest"
Repository = "https://github.com/Archont561/tasknest"
Issues = "https://github.com/Archont561/tasknest/issues"

[project.optional-dependencies]
skill = ["jinja2>=3.1"]

[project.scripts]
tasknest = "tasknest.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tasknest"]
