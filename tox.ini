[tox]
env_list = py{310,311,312,313,314}-{core,skill}
package_root = packages/tasknest-py

[testenv]
package = wheel
deps =
    pytest>=8,<10
    pytest-bdd>=9,<10
    hypothesis>=6,<7
    tomli-w>=1.2,<2
extras =
    skill: skill
commands =
    pytest {tox_root}/packages/tasknest-py/tests
    core: python -c "import importlib.metadata as m, importlib.util as u; assert u.find_spec('jinja2') is None; dist = m.distribution('tasknest'); assert all('extra ==' in r or 'python_version' in r for r in (dist.requires or list()))"
    skill: python -c "import jinja2, tasknest; assert bool(tasknest.__version__); print(tasknest.__version__, jinja2.__version__)"
